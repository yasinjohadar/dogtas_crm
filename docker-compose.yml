services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-dogtas_crm}
      - DB_USER=${DB_USER:-dogtas}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REVIEW_TOKEN_ENCRYPTION_KEY=${REVIEW_TOKEN_ENCRYPTION_KEY:?REVIEW_TOKEN_ENCRYPTION_KEY is required}
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=${DB_NAME:-dogtas_crm}
      - MARIADB_USER=${DB_USER:-dogtas}
      - MARIADB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      - TZ=UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
